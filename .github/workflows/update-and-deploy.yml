name: Daily snapshot and GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *' # 00:00 Europe/Moscow; Actions may queue the job.
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: gymscape-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[roster] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify delta calculations
        run: python -m unittest discover -s tests -v
      - name: Verify calendar periods
        run: node --test tests/test_metrics.cjs
      - name: Process public roster requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/manage_roster.py
      - name: Collect public counters
        # A pending scheduled run may be superseded by an issue/push. Any run
        # in the midnight window can fill the same idempotent daily boundary.
        run: python scripts/collect.py --mode auto
      - name: Build dashboard data
        run: python scripts/build_data.py
      - name: Keep snapshots in Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add players.json history site/data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save GymScape snapshot'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Close processed roster requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/manage_roster.py --close-processed
