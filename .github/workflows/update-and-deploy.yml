name: Daily snapshot and GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *' # 00:00 Europe/Moscow; Actions may queue the job.
  workflow_dispatch:
    inputs:
      collect:
        description: 'Capture today’s midnight snapshot (00:00–05:59 Moscow only)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gymscape-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify delta calculations
        run: python -m unittest discover -s tests -v
      - name: Collect public counters
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: python scripts/collect.py --mode daily
      - name: Build dashboard data
        run: python scripts/build_data.py
      - name: Keep snapshots in Git
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history site/data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save GymScape snapshot'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
